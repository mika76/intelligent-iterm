<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Panel</title>
<style>
  /* Defaults; replaced at runtime by the active iTerm2 profile's colors and font. */
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --dim: #8a8a8e; --accent: #2f6fd6;
    --red: #c0392b; --green: #2e8b3e; --yellow: #a07800;
    --font: ui-monospace, Menlo, monospace; --size: 13px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #1e1e1e; --fg: #e6e6e6; --dim: #8a8a8a; --accent: #4c9aff;
      --red: #ff7b6b; --green: #5fd37a; --yellow: #e5c07b;
    }
  }
  :root {
    --surface: color-mix(in srgb, var(--fg) 6%, var(--bg));
    --border: color-mix(in srgb, var(--fg) 16%, var(--bg));
    --small: calc(var(--size) * 0.85);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: var(--size); line-height: 1.4;
    display: flex; flex-direction: column;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  button {
    font: inherit; font-size: var(--small); color: var(--fg); background: transparent;
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--bg)); }
  button.link { border: none; padding: 0 2px; color: var(--dim); }

  /* Title strip, like a pane title */
  header {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    border-bottom: 1px solid var(--border); font-size: var(--small); color: var(--dim);
  }
  header .title { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .title::before { content: "✳ "; color: var(--accent); }
  header .title .meta { color: var(--dim); }
  header .status { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  header label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  header input { accent-color: var(--accent); margin: 0; }

  /* Transcript */
  #log { flex: 1; overflow-y: auto; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { overflow-wrap: anywhere; }
  .msg.user { color: var(--fg); white-space: pre-wrap; padding-left: 1.5ch; text-indent: -1.5ch; }
  .msg.user::before { content: "❯ "; color: var(--accent); }
  .msg.user .ctx { display: block; text-indent: 0; color: var(--dim); font-size: var(--small); }
  .msg.agent p { margin: 0 0 6px; }
  .msg.agent > :last-child { margin-bottom: 0; }
  .note { color: var(--dim); font-size: var(--small); }
  .note.error { color: var(--red); }
  .note.tool { padding-left: 1ch; }
  code { font: inherit; color: var(--accent); }
  strong { font-weight: 700; }
  .msg.agent h1, .msg.agent h2, .msg.agent h3, .msg.agent h4, .msg.agent h5, .msg.agent h6 {
    font-size: inherit; font-weight: 700; margin: 10px 0 4px; }
  .msg.agent h1, .msg.agent h2 { color: var(--accent); }
  .msg.agent h5, .msg.agent h6 { color: var(--dim); }
  .msg.agent > :first-child { margin-top: 0; }
  .msg.agent ul, .msg.agent ol { margin: 0 0 6px; padding-left: 2.5ch; }
  .msg.agent li > ul, .msg.agent li > ol { margin: 0; }
  .msg.agent ul { list-style: none; }
  .msg.agent ul > li::before { content: "•"; color: var(--dim); display: inline-block; width: 2ch; margin-left: -2ch; }
  .msg.agent ul ul > li::before { content: "◦"; }
  .msg.agent ul > li.task::before { content: none; }
  .msg.agent li.task .check { color: var(--dim); margin-left: -2ch; }
  .msg.agent ol > li::marker { color: var(--dim); }
  .msg.agent blockquote { margin: 0 0 6px; padding-left: 1ch; border-left: 2px solid var(--border); color: var(--dim); }
  .msg.agent hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .msg.agent a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .msg.agent em { font-style: italic; }
  .tablewrap { overflow-x: auto; margin: 0 0 6px; }
  .msg.agent table { border-collapse: collapse; }
  .msg.agent th, .msg.agent td { border: 1px solid var(--border); padding: 1px 1ch; text-align: left; vertical-align: top; }
  .msg.agent th { background: var(--surface); }
  .codeblock { background: var(--surface); border-left: 2px solid var(--accent); margin: 6px 0; }
  .codeblock pre { margin: 0; padding: 6px 8px; overflow-x: auto; font: inherit; }
  .codeblock .bar { display: flex; gap: 6px; justify-content: flex-end; padding: 0 6px 6px; }
  .card { border: 1px solid var(--border); border-left: 2px solid var(--yellow); padding: 6px 8px; }
  .card .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .thinking { color: var(--dim); font-size: var(--small); }
  .thinking::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--fg); }
  @keyframes blink { 50% { opacity: 0; } }

  /* Status bar: latest failed command, like Intelligent Terminal's agent status bar */
  #failbar {
    display: none; align-items: center; gap: 8px; padding: 4px 10px;
    border-top: 1px solid var(--border); font-size: var(--small);
    background: color-mix(in srgb, var(--red) 10%, var(--bg));
  }
  #failbar.show { display: flex; }
  #failbar .x { color: var(--red); }
  #failbar .cmd { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* Proposed command (propose_command tool): the user inserts, runs or dismisses it */
  .proposal { border: 1px solid var(--border); border-left: 2px solid var(--accent); padding: 6px 8px; }
  .proposal .reason { color: var(--dim); font-size: var(--small); margin-bottom: 4px; }
  .proposal pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  .proposal pre::before { content: "$ "; color: var(--dim); }
  .proposal .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .proposal .outcome { color: var(--dim); font-size: var(--small); }
  .proposal.risky { border-left-color: var(--red); }
  .proposal .risk { color: var(--red); font-size: var(--small); margin-bottom: 4px; }
  .proposal button.confirm { border-color: var(--red); color: var(--red); }
  .doctor { border: 1px solid var(--border); border-left: 2px solid var(--yellow); padding: 6px 8px; }
  .doctor.allok { border-left-color: var(--green); }
  .doctor .head { color: var(--dim); font-size: var(--small); margin-bottom: 4px; }
  .doctor .mark { display: inline-block; width: 2ch; }
  .doctor .ok .mark { color: var(--green); }
  .doctor .warn .mark { color: var(--yellow); }
  .doctor .fail .mark { color: var(--red); }
  .doctor .detail { color: var(--dim); }
  .doctor .fix { padding-left: 2ch; font-size: var(--small); }

  /* Input box, like Intelligent Terminal's agent pane */
  footer { padding: 6px 10px 8px; position: relative; }
  .prompt { display: flex; gap: 1ch; align-items: flex-end; border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; }
  .prompt:focus-within { border-color: var(--accent); }
  #slash { display: none; position: absolute; left: 10px; right: 10px; bottom: 100%;
    max-height: 14em; overflow-y: auto; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; font-size: var(--small); }
  #slash.show { display: block; }
  #slash div { padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #slash div .d { color: var(--dim); margin-left: 1ch; }
  #slash div.sel { background: var(--surface); color: var(--accent); }
  .prompt .glyph { align-self: flex-start; }
  .prompt .glyph { color: var(--accent); line-height: 1.4; }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--fg);
    font: inherit; line-height: 1.4; padding: 0; min-height: 1.4em; max-height: 10em;
    caret-color: var(--cursor, var(--fg));
  }
  textarea::placeholder { color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="title" id="agentline">Claude Code</span>
  <span class="status" id="status">connecting…</span>
  <label title="Send the active session's directory, last command, exit status and output">
    <input type="checkbox" id="attach"> context</label>
  <label title="Also send the visible screen with the next message">
    <input type="checkbox" id="screen"> screen</label>
  <button id="newchat" class="link" title="Start a fresh conversation">new</button>
  <button id="dock" class="link"></button>
</header>
<main id="log"></main>
<div id="failbar">
  <span class="x">✗</span>
  <span class="cmd" id="failtext"></span>
  <button id="explain" class="primary" data-needs-idle="1">Explain</button>
  <button id="failclose" class="link" title="Dismiss">✕</button>
</div>
<footer>
  <div id="slash"></div>
  <div class="prompt">
    <span class="glyph">❯</span>
    <textarea id="input" rows="1" placeholder="Ask anything, / for commands…"></textarea>
    <button id="send" class="primary" title="Send (⏎)">Send</button>
  </div>
</footer>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send");
let agentCommands = [];
// The conversation this page shows: its tab's, or (toolbelt) the active tab's.
// The server says which in a "switch" event; every request names it.
const tabParam = new URLSearchParams(location.search).get("tab") || "";
let conv = tabParam;
let busy = false, agentEl = null, agentText = "", thinkingEl = null, lastFailure = null;

// ---- small helpers -------------------------------------------------------
function store(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); }
  catch (e) { return null; }
}
async function api(path, body) {
  const res = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json", "X-Token": token },
    body: JSON.stringify(Object.assign({ conv }, body || {})),
  });
  const data = await res.json().catch(() => ({ ok: false, error: res.statusText }));
  if (!data.ok) note(data.error || "Request failed", "error");
  return data;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function nearBottom(px) { return log.scrollHeight - log.scrollTop - log.clientHeight < px; }
function add(node) {
  const stick = nearBottom(40);
  log.insertBefore(node, thinkingEl && thinkingEl.parentNode ? thinkingEl : null);
  if (stick) log.scrollTop = log.scrollHeight;
  return node;
}
function note(text, cls) { return add(el("div", "note" + (cls ? " " + cls : ""), text)); }
function setBusy(b) {
  busy = b;
  sendBtn.textContent = b ? "Stop" : "Send";
  sendBtn.title = b ? "Stop (esc)" : "Send (⏎)";
  document.querySelectorAll("button[data-needs-idle]").forEach((x) => (x.disabled = b));
  if (b && !thinkingEl) { thinkingEl = el("div", "thinking", "thinking "); log.appendChild(thinkingEl); }
  if (!b && thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return; } catch (e) { /* fall back */ }
  const ta = el("textarea"); ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); ta.remove();
}

// ---- theme from the iTerm2 profile ---------------------------------------
// The server bakes the current theme into <html style>; this applies later changes.
function applyTheme(t) {
  const root = document.documentElement;
  root.dataset.theme = "iterm";
  Object.entries(t.vars || {}).forEach(([k, v]) => root.style.setProperty(k, v));
}

// ---- markdown-ish rendering of agent replies -------------------------------
const SHELL_LANGS = ["", "bash", "sh", "shell", "zsh", "console", "fish"];
function renderInline(text, parent) {
  // Inline markdown as DOM nodes (never innerHTML): `code`, [links](url), **bold**,
  // __bold__, *italic*, _italic_, ~~strike~~ and bare URLs.
  const re = /(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)|\[([^\]\n]+)\]\(([^)\s]+)\)|\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|\*(?!\s)([^*\n]+?)\*|(?<![\w])_(?!\s)([^_\n]+?)_(?![\w])|(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"*_])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) parent.appendChild(el("code", "", m[2].trim()));
    else if (m[3]) parent.appendChild(link(m[4], m[3]));
    else if (m[5] || m[6]) renderInline(m[5] || m[6], parent.appendChild(el("strong")));
    else if (m[7]) renderInline(m[7], parent.appendChild(el("s")));
    else if (m[8] || m[9]) renderInline(m[8] || m[9], parent.appendChild(el("em")));
    else parent.appendChild(link(m[10]));
    last = m.index + m[0].length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}
function link(url, label) {
  // Links open in the default browser (the panel itself must stay on its page).
  if (!/^https?:\/\//i.test(url)) {
    const span = el("span");
    renderInline(label || url, span);
    return span;
  }
  const a = el("a");
  a.href = url; a.title = url;
  if (label) renderInline(label, a); else a.textContent = url;
  a.onclick = (e) => { e.preventDefault(); api("/api/open", { url }); };
  return a;
}
function codeBlock(lang, code, done) {
  const box = el("div", "codeblock");
  box.appendChild(el("pre", "", code));
  if (!done) return box;
  const bar = el("div", "bar");
  const cmd = code.replace(/\n+$/, "");
  const copyBtn = el("button", "link", "copy");
  copyBtn.onclick = async () => { await copy(cmd); copyBtn.textContent = "copied"; };
  bar.appendChild(copyBtn);
  if (SHELL_LANGS.includes(lang.toLowerCase()) && cmd.trim()) {
    const ins = el("button", "primary", "insert ⇥");
    ins.title = "Type into the active terminal session (does not press Enter)"
      + (cmd.includes("\n") ? "; multi-line works in zsh and fish" : "");
    ins.onclick = async () => {
      const r = await api("/api/insert", { text: cmd });
      if (r.ok) ins.textContent = "inserted ✓";
    };
    bar.appendChild(ins);
  }
  box.appendChild(bar);
  return box;
}
function renderMarkdown(src, container) {
  container.replaceChildren();
  const parts = src.split(/^[ \t]*```/m);
  parts.forEach((part, i) => {
    if (i % 2 === 1) { // inside a fence: first line is the language
      const nl = part.indexOf("\n");
      const lang = nl === -1 ? "" : part.slice(0, nl).trim();
      const code = nl === -1 ? "" : part.slice(nl + 1);
      container.appendChild(codeBlock(lang, code, i < parts.length - 1));
    } else {
      renderBlocks(part.split("\n"), container);
    }
  });
}

const LIST_ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const TABLE_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function renderBlocks(lines, container) {
  let para = null;
  const endPara = () => { para = null; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (!line.trim()) { endPara(); continue; }
    if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))) {
      endPara();
      renderInline(m[2], container.appendChild(el("h" + m[1].length)));
    } else if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) {
      endPara();
      container.appendChild(el("hr"));
    } else if (/^\s{0,3}>/.test(line)) {
      endPara();
      const quoted = [];
      while (i < lines.length && /^\s{0,3}>/.test(lines[i])) quoted.push(lines[i++].replace(/^\s{0,3}>\s?/, ""));
      i--;
      renderBlocks(quoted, container.appendChild(el("blockquote")));
    } else if (LIST_ITEM.test(line)) {
      endPara();
      i = renderList(lines, i, container) - 1;
    } else if (line.includes("|") && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
      endPara();
      i = renderTable(lines, i, container) - 1;
    } else {
      if (para) para.appendChild(el("br"));
      else para = container.appendChild(el("p"));
      renderInline(line.trim(), para);
    }
  }
}
function renderList(lines, i, container) {
  // Nested lists by indentation; returns the index of the first line after the list.
  const stack = []; // {indent, list}
  let li = null;
  for (; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(LIST_ITEM);
    if (!line.trim()) {
      const next = lines.slice(i + 1).find((l) => l.trim());
      if (next && (LIST_ITEM.test(next) || /^\s{2,}/.test(next))) continue;
      break;
    }
    if (!m) {
      if (li && /^\s+/.test(line)) { li.appendChild(el("br")); renderInline(line.trim(), li); continue; }
      if (li && !/^\s{0,3}(#|>|```)/.test(line)) { li.appendChild(el("br")); renderInline(line.trim(), li); continue; }
      break;
    }
    const indent = m[1].replace(/\t/g, "    ").length;
    const ordered = /\d/.test(m[2]);
    while (stack.length && stack[stack.length - 1].indent > indent) stack.pop();
    let top = stack[stack.length - 1];
    if (!top || indent > top.indent || top.ordered !== ordered) {
      if (top && indent === top.indent) stack.pop(); // same level, different kind
      const list = el(ordered ? "ol" : "ul");
      if (ordered && parseInt(m[2], 10) !== 1) list.start = parseInt(m[2], 10);
      const parent = stack.length && li ? li : container;
      parent.appendChild(list);
      top = { indent, ordered, list };
      stack.push(top);
    }
    li = top.list.appendChild(el("li"));
    const task = m[3].match(/^\[([ xX])\]\s+(.*)$/);
    if (task) {
      li.className = "task";
      li.appendChild(el("span", "check", task[1] === " " ? "☐ " : "☑ "));
      renderInline(task[2], li);
    } else {
      renderInline(m[3], li);
    }
  }
  return i;
}
function renderTable(lines, i, container) {
  const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const align = cells(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : ""));
  const wrap = container.appendChild(el("div", "tablewrap"));
  const table = wrap.appendChild(el("table"));
  const addRow = (row, tag) => {
    const tr = table.appendChild(el("tr"));
    cells(row).forEach((c, k) => {
      const td = tr.appendChild(el(tag));
      if (align[k]) td.style.textAlign = align[k];
      renderInline(c, td);
    });
  };
  addRow(lines[i], "th");
  for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) addRow(lines[i], "td");
  return i;
}

// ---- failed-command status bar -------------------------------------------------
function showFailure(f) {
  lastFailure = f;
  $("failtext").replaceChildren(el("code", "", f.command),
    document.createTextNode(" exited " + f.exit));
  $("failbar").classList.add("show");
  $("explain").disabled = busy;
}
function hideFailure() { lastFailure = null; $("failbar").classList.remove("show"); }
$("explain").onclick = async () => {
  if (!lastFailure) return;
  const r = await api("/api/explain", { id: lastFailure.id });
  if (r.ok) hideFailure();
};
$("failclose").onclick = hideFailure;

// ---- events from the server -------------------------------------------------
function handle(ev) {
  switch (ev.type) {
    case "theme":
      applyTheme(ev); break;
    case "switch":
      conv = ev.conv;
      log.replaceChildren(); agentEl = null; thinkingEl = null; setBusy(false); hideFailure(); break;
    case "reset":
      log.replaceChildren(); agentEl = null; thinkingEl = null; setBusy(false); hideFailure(); break;
    case "status":
      $("status").textContent = ev.text; break;
    case "user": {
      agentEl = null;
      const m = add(el("div", "msg user", ev.text));
      if (ev.context) m.appendChild(el("span", "ctx", ev.context));
      setBusy(true);
      break;
    }
    case "chunk":
      if (!agentEl) { agentEl = add(el("div", "msg agent")); agentText = ""; }
      agentText += ev.text;
      renderMarkdown(agentText, agentEl);
      if (nearBottom(120)) log.scrollTop = log.scrollHeight;
      break;
    case "tool": { // one line per tool call, updated in place
      let line = document.getElementById("tool-" + ev.id);
      if (!line) { line = note("", "tool"); line.id = "tool-" + ev.id; agentEl = null; }
      if (ev.title) line.dataset.title = ev.title;
      const mark = { completed: "✓", failed: "✗" }[ev.status] || "⚙";
      line.textContent = mark + " " + (line.dataset.title || "tool");
      break;
    }
    case "permission": {
      agentEl = null;
      const card = add(el("div", "card"));
      card.id = "perm-" + ev.id;
      card.appendChild(el("div", "", "Allow Claude to run: " + ev.title + "?"));
      const row = card.appendChild(el("div", "row"));
      ev.options.forEach((o) => {
        const b = el("button", o.kind && o.kind.startsWith("allow") ? "" : "primary", o.name);
        b.onclick = () => api("/api/permission", { id: ev.id, optionId: o.optionId });
        row.appendChild(b);
      });
      break;
    }
    case "permission_done": {
      const card = $("perm-" + ev.id);
      if (card) card.querySelectorAll("button").forEach((b) => (b.disabled = true));
      break;
    }
    case "failed_command":
      showFailure(ev); break;
    case "failure_handled":
      if (lastFailure && lastFailure.id === ev.id) hideFailure();
      break;
    case "proposal": {
      agentEl = null;  // text after the card starts a new message below it
      const card = add(el("div", "proposal"));
      card.id = "prop-" + ev.id;
      const risks = ev.risks || [];
      if (risks.length) {
        card.classList.add("risky");
        card.appendChild(el("div", "risk", "⚠ " + risks.join(" · ")));
      }
      if (ev.reason) card.appendChild(el("div", "reason", ev.reason));
      card.appendChild(el("pre", "", ev.command));
      const row = card.appendChild(el("div", "row"));
      [["insert", "Insert ⇥", "primary", "Type it at your prompt without running it"],
       ["run", "Run ⏎", "", "Type it and press Enter in your terminal"],
       ["dismiss", "Dismiss", "link", ""]].forEach(([action, label, cls, title]) => {
        const b = el("button", cls, label);
        b.title = title;
        let armed = null;
        b.onclick = () => {
          // A risky command needs a second click to run.
          if (action === "run" && risks.length && !armed) {
            b.textContent = "Confirm run ⏎"; b.classList.add("confirm");
            armed = setTimeout(() => { armed = null; b.textContent = label; b.classList.remove("confirm"); }, 4000);
            return;
          }
          clearTimeout(armed);
          api("/api/proposal", { id: ev.id, action });
        };
        row.appendChild(b);
      });
      break;
    }
    case "proposal_done": {
      const card = $("prop-" + ev.id);
      if (!card) break;
      const row = card.querySelector(".row");
      row.replaceChildren(el("span", "outcome",
        { inserted: "inserted at the prompt", ran: "ran in the terminal", dismissed: "dismissed" }[ev.outcome] || ev.outcome));
      break;
    }
    case "doctor": {
      agentEl = null;
      const allOk = ev.checks.every((c) => c.status === "ok");
      const card = add(el("div", "doctor" + (allOk ? " allok" : "")));
      card.appendChild(el("div", "head", ev.problemsOnly ? "Setup needs attention (/doctor for the full report)"
        : allOk ? "Setup looks good" : "Setup check"));
      ev.checks.forEach((c) => {
        const row = card.appendChild(el("div", c.status));
        row.appendChild(el("span", "mark", { ok: "✓", warn: "!", fail: "✗" }[c.status] || "?"));
        row.appendChild(document.createTextNode(c.name + " "));
        row.appendChild(el("span", "detail", c.detail));
        if (c.fix && c.status !== "ok") card.appendChild(el("div", "fix", "→ " + c.fix));
      });
      break;
    }
    case "agent":
      $("agentline").replaceChildren(document.createTextNode(ev.name),
        el("span", "meta", [ev.version && " · v" + ev.version, ev.model && " · " + ev.model].filter(Boolean).join("")));
      break;
    case "commands":
      agentCommands = ev.commands || []; break;
    case "turn_end":
      agentEl = null; setBusy(false);
      if (ev.stopReason === "cancelled") note("stopped");
      break;
    case "error":
      note(ev.message, "error"); break;
  }
}

function connect() {
  const es = new EventSource("/events?t=" + encodeURIComponent(token)
    + (tabParam ? "&tab=" + encodeURIComponent(tabParam) : ""));
  es.onopen = () => {
    // The server replays theme + the whole conversation on every (re)connect.
    log.replaceChildren(); agentEl = null; thinkingEl = null; setBusy(false); hideFailure();
    $("status").textContent = "ready";
  };
  es.onmessage = (m) => handle(JSON.parse(m.data));
  es.onerror = () => { $("status").textContent = "disconnected — retrying…"; };
}

// ---- composer ----------------------------------------------------------------
async function send() {
  if (busy) { await api("/api/cancel"); return; }
  const text = input.value.trim();
  if (!text) return;
  const r = await api("/api/send", { text, attach: $("attach").checked, screen: $("screen").checked });
  if (r.ok) { input.value = ""; $("screen").checked = false; updateSlash(); fitInput(); }
}
sendBtn.onclick = send;

// ---- "/" commands: the panel's own plus Claude Code's (skills, custom commands) ----
const PANEL_COMMANDS = [
  { name: "new", description: "Start a fresh conversation", run: () => api("/api/new") },
  { name: "explain", description: "Explain the last failed command", run: () => lastFailure ? $("explain").click() : note("No failed command to explain") },
  { name: "screen", description: "Attach the visible screen to the next message", run: () => { $("screen").checked = true; } },
  { name: "doctor", description: "Check the setup (Node, Claude Code, shell integration)", run: () => api("/api/doctor") },
  { name: "hide", description: "Hide the panel (⌃⇧.)", run: () => api("/api/dock") },
];
const slash = $("slash");
let slashItems = [], slashSel = 0;
function updateSlash() {
  const m = /^\/(\S*)$/.exec(input.value);
  if (!m) { slash.classList.remove("show"); slashItems = []; return; }
  const q = m[1].toLowerCase();
  const all = PANEL_COMMANDS.concat(agentCommands.filter((c) => !PANEL_COMMANDS.some((p) => p.name === c.name)));
  slashItems = all.filter((c) => c.name.toLowerCase().startsWith(q))
    .concat(all.filter((c) => !c.name.toLowerCase().startsWith(q) && c.name.toLowerCase().includes(q))).slice(0, 50);
  slashSel = Math.min(slashSel, Math.max(0, slashItems.length - 1));
  slash.replaceChildren(...slashItems.map((c, i) => {
    const row = el("div", i === slashSel ? "sel" : "", "/" + c.name);
    row.appendChild(el("span", "d", c.description || ""));
    row.onmousedown = (e) => { e.preventDefault(); slashSel = i; pickSlash(); };
    return row;
  }));
  slash.classList.toggle("show", slashItems.length > 0);
  const sel = slash.children[slashSel];
  if (sel) sel.scrollIntoView({ block: "nearest" });
}
function pickSlash() {
  const c = slashItems[slashSel];
  if (!c) return;
  if (c.run) { input.value = ""; c.run(); }
  else input.value = "/" + c.name + " ";
  updateSlash(); input.focus();
}
function fitInput() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
input.addEventListener("input", () => { slashSel = 0; updateSlash(); fitInput(); });
input.addEventListener("keydown", (e) => {
  if (slashItems.length && ["ArrowDown", "ArrowUp", "Tab", "Enter", "Escape"].includes(e.key)) {
    e.preventDefault();
    if (e.key === "ArrowDown") slashSel = (slashSel + 1) % slashItems.length;
    else if (e.key === "ArrowUp") slashSel = (slashSel - 1 + slashItems.length) % slashItems.length;
    else if (e.key === "Escape") { slashItems = []; slash.classList.remove("show"); return; }
    else return pickSlash();
    return updateSlash();
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  if (e.key === "Escape" && busy) { e.preventDefault(); api("/api/cancel"); }
});
$("newchat").onclick = () => api("/api/new");
// Docked (bottom split) vs toolbelt: same page, the server adds dock=1 for the split.
const docked = new URLSearchParams(location.search).get("dock") === "1";
$("dock").textContent = docked ? "hide" : "dock ↓";
$("dock").title = (docked ? "Close this pane" : "Open the panel below the terminal") + " (⌃⇧.)";
$("dock").onclick = () => api("/api/dock");
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && !e.metaKey && !e.altKey && e.code === "Period") {
    e.preventDefault(); api("/api/dock");
  }
});
$("attach").checked = store("attach") !== "0";
$("attach").onchange = () => store("attach", $("attach").checked ? "1" : "0");
connect();
api("/api/hello");  // starts Claude Code early, for its model and / commands
input.focus();
</script>
